name: Godot 4.7.2 — Suíte de Testes

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2 (Linux x86_64)
        run: |
          curl -fL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -o -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version

      - name: Rodar suíte (TEST_PASS obrigatório, sem SCRIPT ERROR/ERROR)
        env:
          GODOT: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          GODOT_ARGS: --headless
        run: tests/run_tests.sh

      - name: Boot do jogo (cena principal emite TEST_PASS)
        run: |
          GODOT=/tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          "$GODOT" --headless --path . --quit-after 120 2>&1 | tee /tmp/boot.log
          grep -q "TEST_PASS|overworld_boot" /tmp/boot.log
          ! grep -E -q "SCRIPT ERROR|ERROR:" /tmp/boot.log
